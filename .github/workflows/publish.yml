name: Disponibilizar atualizacao assinada

on:
  push:
    branches:
      - incoming

permissions:
  contents: write

concurrency:
  group: publish-staged-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Obter pacote preparado
        uses: actions/checkout@v4

      - name: Validar e publicar GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./release-meta.json').version")"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Versao invalida: $VERSION" >&2
            exit 1
          fi
          test -s latest.json
          test -s release-notes.md
          test -s artifacts/Automation-Explorer-Setup-Windows-x64.exe
          test -s artifacts/Automation-Explorer-Setup-Windows-x64.exe.sig
          TAG="v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A release $TAG ja existe." >&2
            exit 1
          fi
          gh release create "$TAG" \
            latest.json \
            artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Automation Explorer $VERSION" \
            --notes-file release-notes.md \
            --latest
